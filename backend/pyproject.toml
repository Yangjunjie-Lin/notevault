[project]
name = "notevault-api"
version = "1.3.0"
description = "FastAPI backend for NoteVault"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "firebase-admin==6.5.0",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: requires the local Firestore Emulator",
]
