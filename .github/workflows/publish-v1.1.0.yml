name: Publish NoteVault v1.1.0

on:
  push:
    branches: [main]
    paths:
      - docs/release-notes-v1.1.0.md
      - scripts/verify-release.mjs
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify release metadata
        run: npm run release:check

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists; no action needed."
            exit 0
          fi

          gh release create v1.1.0 \
            --target "$GITHUB_SHA" \
            --title "NoteVault v1.1.0 — Stable Maintenance Release" \
            --notes-file docs/release-notes-v1.1.0.md \
            --latest
