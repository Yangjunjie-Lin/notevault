name: Contract sync once

on:
  push:
    branches: [agent/final-seal]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-seal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Regenerate committed API contract
        run: npm run contract:generate
      - name: Commit generated contract when changed
        shell: bash
        run: |
          if git diff --quiet -- backend/openapi.json frontend/src/features/notes/generated.ts; then
            echo 'Contract already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/openapi.json frontend/src/features/notes/generated.ts
          git commit -m 'Regenerate OpenAPI contract'
          git push origin HEAD:agent/final-seal
