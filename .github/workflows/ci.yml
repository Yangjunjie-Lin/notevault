name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run smoke tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://notevault-api.vercel.app
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: example
          VITE_FIREBASE_STORAGE_BUCKET: example.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: "1:0:web:ci"
        run: npm run build

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile modules
        run: python -m compileall backend/app

      - name: Import smoke check
        run: python -c "import sys; sys.path.insert(0, 'backend'); from app.main import app; assert app.title"

      - name: Run tests
        run: python -m pytest backend/tests

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require MIT license and ignore secrets
        run: |
          test -f LICENSE
          grep -q "MIT License" LICENSE
          grep -q "\.vercel/" .gitignore || grep -q "^\.vercel$" .gitignore
          grep -q "serviceAccountKey.json" .gitignore
          ! git ls-files | grep -E '(^|/)\.env$|serviceAccountKey\.json|\.vercel/'
