name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Integration tests
        working-directory: frontend
        run: npm test
      - name: Coverage gate
        working-directory: frontend
        run: npm run test:coverage
      - name: Production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://notevault-api.vercel.app
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: example
          VITE_FIREBASE_STORAGE_BUCKET: example.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: "1:0:web:ci"
        run: npm run build
      - name: Reject production auth bypass
        working-directory: frontend
        run: npm run test:production-auth-gate
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm audit
          npm audit --omit=dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile modules
        run: python -m compileall backend/app
      - name: Test and coverage gate
        run: python -m pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=85 backend/tests

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify generated types are current
        run: npm run contract:check

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run production-preview browser workflows
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  firebase-integration:
    name: Firestore Emulator integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase CLI
        run: npm ci
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run real Firestore SDK contract tests
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: npm run test:firebase-integration

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify release metadata consistency
        run: npm run release:check
      - name: Validate license, docs, and secret exclusions
        shell: bash
        run: |
          test -f LICENSE
          test -f docs/maintenance.md
          version=$(node -p "require('./package.json').version")
          test -f "docs/release-notes-v${version}.md"
          test -f docs/ai-integration.md
          test -f docs/ai-privacy.md
          test -f .github/dependabot.yml
          test -f .github/ISSUE_TEMPLATE/bug_report.yml
          test -f .github/ISSUE_TEMPLATE/browser_issue.yml
          test -f .github/ISSUE_TEMPLATE/deployment_issue.yml
          grep -q "MIT License" LICENSE
          grep -q "\.vercel/" .gitignore || grep -q "^\.vercel$" .gitignore
          grep -q "serviceAccountKey.json" .gitignore
          grep -q "git clone https://github.com/Yangjunjie-Lin/notevault.git" README.md
          grep -q "SILICONFLOW_API_KEY=YOUR_SILICONFLOW_API_KEY_HERE" .env.example
          ! git grep -I -E -- 'VITE_[A-Z0-9_]*SILICONFLOW|sk-[[:alnum:]_-]{24,}'
          ! git grep -I -E -- 'api\.siliconflow\.cn/v1/chat/completions' -- frontend
          ! git ls-files | grep -E '(^|/)\.env($|\.(local|production|development|test)$)|serviceAccountKey\.json|(^|/)\.vercel/'
          ! git ls-files | grep -E '(^|/)(\.venv|venv)/'
          ! git ls-files | grep -E '(^|/)(playwright-report|test-results|coverage)(/|$)|(^|/)\.coverage$'
          ! git grep -I -E -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:'
