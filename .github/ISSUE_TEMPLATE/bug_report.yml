name: Bug report
description: Report a reproducible NoteVault defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Firebase tokens, service-account JSON, private note text, or sensitive screenshots.
  - type: input
    id: frontend_url
    attributes:
      label: Frontend URL
      placeholder: https://notevault-lovat.vercel.app
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Sanitized console or HTTP error
      description: Remove tokens, credentials, private notes, and personal data.
  - type: dropdown
    id: data_affected
    attributes:
      label: Was note data affected?
      options: ["No", "Possibly", "Yes"]
    validations:
      required: true
