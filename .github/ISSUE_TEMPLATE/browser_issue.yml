name: Browser compatibility issue
description: Report a reproducible browser-specific regression
title: "[Browser]: "
labels: ["browser"]
body:
  - type: markdown
    attributes:
      value: Do not attach tokens, credentials, private notes, or sensitive screenshots.
  - type: input
    id: browser
    attributes:
      label: Browser, version, and device
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Action and reproduction
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized browser diagnostics
